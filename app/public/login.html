<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 32rem; margin: 4rem auto; padding: 0 1.25rem; line-height: 1.6; }
      main { border: 1px solid #8886; border-radius: 1rem; padding: 2rem; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; margin-top: .35rem; padding: .7rem; font: inherit; }
      button { margin-top: 1.25rem; padding: .7rem 1rem; font: inherit; cursor: pointer; }
      #result { min-height: 1.6em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Log in</h1>
      <form id="login">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Log in</button>
      </form>
      <p id="result" role="status" aria-live="polite"></p>
      <p><a href="/register">Create an account</a></p>
    </main>
    <script>
      const form = document.querySelector('#login');
      const result = document.querySelector('#result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        result.textContent = 'Signing in…';
        try {
          const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.fromEntries(new FormData(form))),
          });
          const payload = await response.json();
          if (!response.ok) {
            result.textContent = payload.error || 'Login failed.';
            return;
          }
          window.location.assign('/dashboard');
        } catch {
          result.textContent = 'Login is temporarily unavailable.';
        }
      });
    </script>
  </body>
</html>
